name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single-entry matrix on purpose: production runs 8.5, so that is all CI tests.
        # Add 8.6 here when it reaches RC. Do not re-add 8.4 (nothing runs it).
        php-version: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Dependencies
        run: composer audit --locked

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: ./vendor/bin/pest

      - name: Run Package Tests
        run: composer packages:check

  lowest-deps:
    name: tests (lowest deps) - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11'
            illuminate: 11.36.0
            testbench: ^9.0
            pest: ^3.0
            skip_harness: true
            # Pest 3's Paratest dependency caps PHP at 8.4; the suite itself still runs on PHP 8.5.
            update_options: --ignore-platform-req=php+
          - laravel: '12'
            illuminate: ^12.0
            testbench: ^10.0
            pest: ^3.0
            skip_harness: true
            update_options: ''
          - laravel: '13'
            illuminate: ^13.0
            testbench: ^11.0
            pest: ^4.0
            skip_harness: false
            update_options: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Pin Laravel dependencies
        working-directory: packages/sink-client
        run: |
          composer config audit.block-insecure false
          composer require \
            "illuminate/console:${{ matrix.illuminate }}" \
            "illuminate/contracts:${{ matrix.illuminate }}" \
            "illuminate/filesystem:${{ matrix.illuminate }}" \
            "illuminate/http:${{ matrix.illuminate }}" \
            "illuminate/mail:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            --no-update --no-interaction
          composer require --dev \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            --no-update --no-interaction

      - name: Install lowest dependencies
        working-directory: packages/sink-client
        run: composer update --prefer-lowest --prefer-stable -W --no-interaction ${{ matrix.update_options }}

      - name: Show resolved Laravel version
        working-directory: packages/sink-client
        run: composer show laravel/framework || composer show illuminate/support

      - name: Run package tests
        if: matrix.skip_harness == false
        working-directory: packages/sink-client
        run: composer test

      - name: Run package tests without the thin-host migration-binding harness
        if: matrix.skip_harness == true
        working-directory: packages/sink-client
        run: |
          php vendor/bin/testbench package:discover --ansi
          vendor/bin/pest --filter '/^(?!.*boots through package discovery without the full BfC server package or its surfaces).*$/'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sink_testing
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_CONNECTION: pgsql
      DB_DATABASE: sink_testing
      DB_HOST: 127.0.0.1
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_URL: ''
      DB_USERNAME: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pcntl, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Tests on PostgreSQL
        run: ./vendor/bin/pest --testdox
